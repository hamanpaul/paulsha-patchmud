[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paulsha-patchmud"
dynamic = ["version"]
requires-python = ">=3.11"
description = "PatchMUD：成本優先的純文字回合制 coding-agent 評測引擎"
dependencies = ["PyYAML>=6", "pytest>=8"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

[project.scripts]
patchmud = "patchmud.cli:main"
paulsha-patchmud = "patchmud.scoring.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["patchmud*"]
exclude = ["patchmud.scoring.data*"]

[tool.setuptools.package-data]
"patchmud.scoring" = ["data/**/*"]

[tool.setuptools.exclude-package-data]
"patchmud.scoring" = ["**/__pycache__/*", "**/*.pyc", "**/.pytest_cache/*", "**/.git/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
