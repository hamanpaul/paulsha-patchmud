name: Tests

# Template 骨架：tests/ 尚不存在時整個 job 跳過（新 repo 出生即綠燈）；
# 一旦加入測試套件，pytest 自動成為 PR gate（滿足 policy R-19）。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect test suite
        id: detect
        run: |
          # 以 find 遞迴偵測（涵蓋子目錄）；template 骨架用的
          # `ls a b` 在其中一個 glob 無匹配時整體回非零 → 誤判 has_tests=false
          # 而靜默 skip 成綠（正是 codex F7 警告的 CI-detect 層假綠）。
          count=$(find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | wc -l)
          if [ -d tests ] && [ "$count" -gt 0 ]; then
            echo "Detected $count test files."
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test suite yet; skipping pytest."
          fi

      - name: Install bubblewrap (namespace 隔離 acceptance 依賴，F7)
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # ubuntu-24.04 runner 預設以 AppArmor 擋 unprivileged userns，
          # bwrap 因此建不了 namespace（capabilities 全 False）。放行後
          # F7 的 capability gate 才能真正驗證隔離而非誤判 degraded。
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Setup Python
        if: steps.detect.outputs.has_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f pyproject.toml ]; then python -m pip install -e ".[test]" || python -m pip install -e . || true; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Verify namespace capabilities (F7：不足即失敗，acceptance 不得靜默 skip)
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          python -c "from pathlib import Path; from patchmud.sandbox.isolate import IsolationRunner; c = IsolationRunner(Path('/tmp')).capabilities(); print('capabilities:', c); assert c.mount_ns and c.net_ns and c.pid_ns, f'namespace 能力不足：{c}'"

      - name: Run test suite
        if: steps.detect.outputs.has_tests == 'true'
        run: python -m pytest tests/ -q
