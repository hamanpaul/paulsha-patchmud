name: Tests

# 測試 gate 無條件執行：本 repo 的 tests/ 已是核心資產（數百個測試），
# 不再需要 template 骨架的「tests/ 不存在就整個 job 跳過」機制——那個
# 條件式 gate 只剩假綠風險：detect 步驟一旦誤判，整個測試套件會靜默
# skip 成綠（repo 曾因 `ls a b` 的 glob 語意踩過一次，見 CHANGELOG）。
# policy R-19（1.0.16 起）也將條件式測試 gate 標為高風險樣式，下一版轉 FAIL。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bubblewrap (namespace 隔離 acceptance 依賴，F7)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # ubuntu-24.04 runner 預設以 AppArmor 擋 unprivileged userns，
          # bwrap 因此建不了 namespace（capabilities 全 False）。放行後
          # F7 的 capability gate 才能真正驗證隔離而非誤判 degraded。
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          # 測試框架已列在 pyproject 的 runtime 依賴（引擎在沙箱內執行 probe
          # 需要它），不在此重複安裝——多餘之外，也會讓 R-19 的解析器把這個
          # 安裝 step 誤判成測試執行點。
          #
          # 不吞安裝失敗（原本結尾有 `|| true`）：測試 gate 現在是無條件的，
          # 安裝一旦失敗卻靜默放行，後續會以難解的 import error 收場，或更糟
          # ——測到的是上一次殘留的環境。packaging 壞掉就該當場失敗。
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Verify namespace capabilities (F7：不足即失敗，acceptance 不得靜默 skip)
        run: |
          python -c "from pathlib import Path; from patchmud.sandbox.isolate import IsolationRunner; c = IsolationRunner(Path('/tmp')).capabilities(); print('capabilities:', c); assert c.mount_ns and c.net_ns and c.pid_ns, f'namespace 能力不足：{c}'"

      - name: Run test suite
        run: python -m pytest tests/ -q
