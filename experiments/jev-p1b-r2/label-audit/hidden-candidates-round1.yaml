    rationale: page 永遠回傳 more=False，export 因此 next 恆為 None。
    criterion: export() over a tenant with 5 rows and size=2 returns a non-null next cursor on the first page.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/query.py after the change
          def page(tenant, offset, size):
              rows = ROWS[tenant]
              return rows[:size], False

          # src/export.py (unchanged)
          def export(principal, tenant, token=None, size=2):
              if not can_read(principal, tenant):
                  raise PermissionError("forbidden")
              offset = decode(token) if token else 0
              rows, more = page(tenant, offset, size)
              return {"records": rows, "next": encode(offset + len(rows), tenant) if more else None}

