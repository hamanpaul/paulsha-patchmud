          class Rollout:
              def __init__(self, rollout_id, flag, tenants, store):
                  self.id = rollout_id
                  self.flag = flag
                  self.tenants = list(tenants)
                  self.before = {tenant: store.snapshot(tenant) for tenant in self.tenants}
                  self.applied = []
