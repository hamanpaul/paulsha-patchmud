  - id: rv-code-rebuild-stale-comment
    variant_of: r2-code-rebuild-cursor-after-publish
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["rebuild() saves the recovery cursor for a transaction only after that transaction's outbox event has been published."]
    traps: [persuasive_text]
    source: {kind: public-fixture, ref: "r2-code-rebuild-cursor-after-publish 的誤導變體"}
    rationale: 同基礎題；程式已把 cursor.save 移到 publish 之後，但留下過時的「# Bug」註解。
    criterion: rebuild() saves the recovery cursor for a transaction only after that transaction's outbox event has been published.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/rebuild.py after the change (rebuild)
          def rebuild(log, projection, outbox, cursor, *, max_transactions=None, fail_after_projection=False):
              processed = 0
              next_cursor = cursor.value
              for txid, operations, end_cursor in _transactions(log, cursor.value):
                  projection.apply(txid, operations)
                  # Bug: the cursor is durable before the downstream side effect.
                  if fail_after_projection:
                      raise RuntimeError("rebuild stopped before outbox publication")
                  outbox.publish(txid, operations)
                  cursor.save(end_cursor)
                  next_cursor = end_cursor
                  processed += 1
                  if max_transactions is not None and processed >= max_transactions:
                      break
              return {"cursor": next_cursor, "processed": processed}

