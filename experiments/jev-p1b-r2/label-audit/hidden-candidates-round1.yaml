  - id: r2-code-outbox-publish-idempotent
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["Publishing the same txid twice leaves exactly one outbox event for that txid."]
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR 40 engineering-v1/recovery-transaction-rebuild reference.patch（outbox.py）"}
    rationale: publish 先檢查 events 是否已有同 txid，有則 return，不會 append 第二筆。
    criterion: Publishing the same txid twice leaves exactly one outbox event for that txid.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/outbox.py after the change
          class Outbox:
              def __init__(self):
                  self.events = []

              def publish(self, txid, operations):
                  if any(event["txid"] == txid for event in self.events):
                      return
                  self.events.append({"txid": txid, "operations": [dict(item) for item in operations]})

