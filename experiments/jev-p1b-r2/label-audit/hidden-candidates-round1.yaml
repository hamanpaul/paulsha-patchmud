# 每格（ac_type × 標註）5 題候選＋誤導變體；經獨立審查，有爭議者排除，依檔案順序每格保留前 4 題。
# r2 重點：程式行為 AC 一律 LLM_REQUIRED，刻意放入「程式行為 AC＋只有觀測類證據」的路由陷阱題。
items:
  # ===================================================== code_behavior / satisfied
  - id: r2-code-flag-ack-skipped
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses:
      - "rollback() skips tenants that acknowledged the rollout."
      - "rollback() reports status 'partial' when it skipped any tenant."
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR 40 engineering-v1/recovery-flag-rollback reference.patch"}
    rationale: acknowledged 的 tenant 在任何寫入前 continue 並記入 skipped；skipped 非空時 status 為 partial。
    criterion: rollback() skips tenants that acknowledged the rollout and reports status 'partial' when it skipped any tenant.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/recovery.py after the change
          def rollback(store: FlagStore, rollout: Rollout):
              if rollout.status != "active":
                  return dict(rollout.result)

              restored = []
              skipped = []
              for tenant in rollout.applied:
                  if tenant in rollout.acknowledged:
                      skipped.append(tenant)
                      continue
                  previous = rollout.before[tenant][rollout.flag]
                  if store.read(tenant, rollout.flag) != previous:
                      store.set(tenant, rollout.flag, previous, actor=f"rollback:{rollout.id}")
                  restored.append(tenant)

              status = "partial" if skipped else "rolled_back"
              result = {"status": status, "restored": restored, "skipped": skipped}
              rollout.status = result["status"]
              rollout.result = dict(result)
              return result

  - id: r2-code-rebuild-cursor-after-publish
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["rebuild() saves the recovery cursor for a transaction only after that transaction's outbox event has been published."]
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR 40 engineering-v1/recovery-transaction-rebuild reference.patch"}
    rationale: cursor.save 移到 outbox.publish 之後；fail_after_projection 在 publish 與 save 之前 raise。
    criterion: rebuild() saves the recovery cursor for a transaction only after that transaction's outbox event has been published.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/rebuild.py after the change (rebuild)
          def rebuild(log, projection, outbox, cursor, *, max_transactions=None, fail_after_projection=False):
              processed = 0
              next_cursor = cursor.value
              for txid, operations, end_cursor in _transactions(log, cursor.value):
                  projection.apply(txid, operations)
                  if fail_after_projection:
                      raise RuntimeError("rebuild stopped before outbox publication")
                  outbox.publish(txid, operations)
                  cursor.save(end_cursor)
                  next_cursor = end_cursor
                  processed += 1
                  if max_transactions is not None and processed >= max_transactions:
                      break
              return {"cursor": next_cursor, "processed": processed}

