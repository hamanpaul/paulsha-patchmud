          def _wait_device_boot_ready(self, device, *, timeout: float = 180.0, poll_interval: float = 10.0) -> bool:
              """reboot 後輪詢便宜探測，直到 console 回顯 sentinel 或逾時。"""
              deadline = time.monotonic() + max(float(timeout), poll_interval)
              probe = "echo __BOOT_OK__"
              while True:
                  try:
                      out = self._output_text(self._execute_command(device, probe, timeout=15.0))
                  except Exception:
                      out = ""
                  if "__BOOT_OK__" in out:
                      return True
                  if time.monotonic() >= deadline:
                      return False
                  time.sleep(poll_interval)
      - id: e2
        kind: documentation
        content: |
