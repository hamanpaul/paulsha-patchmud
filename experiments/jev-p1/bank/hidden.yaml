  - id: eng-config-failed-reload-keeps-last-good
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/repair-config-rollback reference.patch"}
    rationale: parse 與 _derive 都在任何屬性指派之前執行；任一個 raise 時 active、cache、file_values 都維持原值。
    criterion: >-
      If reload() fails validation (for example because the region is empty),
      the store keeps its previous active configuration and cache unchanged.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/reloader.py after the change
          class ConfigStore:
              """Keep the last known-good configuration and its derived cache."""

              def __init__(self, file_values, env):
                  self.file_values = dict(file_values)
                  self.active = parse(self.file_values, env)
                  self.cache = self._derive(self.active)

              @staticmethod
              def _derive(config):
                  if not isinstance(config["region"], str) or not config["region"]:
                      raise ValueError("region must be non-empty")
                  return {"endpoint": f"{config['region']}:{config['port']}"}

              def reload(self, file_values, env):
                  candidate = parse(file_values, env)
                  derived = self._derive(candidate)
                  self.file_values = dict(file_values)
                  self.active = candidate
                  self.cache = derived

