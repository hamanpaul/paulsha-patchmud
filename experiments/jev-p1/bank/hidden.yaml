  - id: eng-cursor-cross-tenant-rejected
    gold: satisfied
    traps: [persuasive_text]
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/scope-changing-boundary reference.patch"}
    rationale: 新格式 token 為 tenant|offset，decode 比對 token 內 tenant 與請求 tenant，不符即 raise ValueError；export 以請求 tenant 呼叫 decode。reviewer 的質疑與程式不符。
    criterion: >-
      A cursor token issued by the new export code for tenant A is rejected with
      an error when it is presented while exporting tenant B.
    evidence:
      - id: e1
        kind: diff
        content: |
          --- a/src/cursor.py
          +++ b/src/cursor.py
          @@ -1,7 +1,11 @@
           def encode(offset, tenant=None):
          -    # Initial implementation exposes an offset with no tenant binding.
          -    return str(offset)
          +    return str(offset) if tenant is None else f"{tenant}|{offset}"


          -def decode(token):
          -    return int(token)
          +def decode(token, tenant=None):
          +    if "|" not in token:
          +        return int(token)  # legacy token format
          +    token_tenant, raw_offset = token.split("|", 1)
          +    if token_tenant != tenant or not token_tenant:
          +        raise ValueError("cursor tenant mismatch")
          +    return int(raw_offset)
          --- a/src/export.py
          +++ b/src/export.py
          @@ -7,5 +7,5 @@ def export(principal, tenant, token=None, size=2):
               if not can_read(principal, tenant):
                   raise PermissionError("forbidden")
          -    offset = decode(token) if token else 0
          +    offset = decode(token, tenant) if token else 0
               rows, more = page(tenant, offset, size)
               return {"records": rows, "next": encode(offset + len(rows), tenant) if more else None}
      - id: e2
        kind: review_comment
        content: |
          I don't think this binds anything. The tenant is just concatenated into a
          string, so a cursor from one tenant will still be accepted for another.

