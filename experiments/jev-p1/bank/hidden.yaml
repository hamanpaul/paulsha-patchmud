      - id: e3
        kind: source
        content: |
          # src/cursor.py after the change
          def encode(offset, tenant=None):
              return f"{tenant}|{offset}"


          def decode(token):
              return int(token)

          # src/export.py (unchanged)
          def export(principal, tenant, token=None, size=2):
              if not can_read(principal, tenant):
                  raise PermissionError("forbidden")
              offset = decode(token) if token else 0
