  - id: hippo-backup-same-second
    gold: satisfied
    traps: []
    source: {kind: public-issue, ref: "hamanpaul/paulsha-hippo main：importer/registry.py 的 _unique_backup_path 與其回歸測試"}
    rationale: 同名備份已存在時改用 .1、.2 後綴，呼叫點在寫入前取得唯一路徑；測試以同一 backup_path 連寫兩次並斷言兩份備份內容各自正確。
    criterion: 同一秒內對 registry 連續成功寫入兩次時，兩次各自產生的備份都要保留：第二次寫入不得覆寫第一次的備份檔。
    evidence:
      - id: e1
        kind: source
        content: |
          def _unique_backup_path(base: Path) -> Path:
              """回傳不會覆寫既有備份的路徑；必須在 registry lock 內呼叫。"""
              if not base.exists() and not base.is_symlink():
                  return base
              index = 1
              while True:
                  candidate = base.with_name(f"{base.name}.{index}")
                  if not candidate.exists() and not candidate.is_symlink():
                      return candidate
                  index += 1

          # record_discoveries() 內，持有 registry lock 時：
              if backup_path is not None and existing_bytes is not None:
                  written_backup = _unique_backup_path(Path(backup_path))
                  written_backup.parent.mkdir(parents=True, exist_ok=True)
                  backup_tmp = written_backup.with_name(f".{written_backup.name}.tmp")
                  backup_tmp.write_bytes(existing_bytes)
                  os.replace(backup_tmp, written_backup)
      - id: e2
        kind: test
        content: |
          def test_same_second_backups_never_overwrite_each_other(tmp_path):
              registry = tmp_path / "project-hippo.yaml"
              registry.write_text(render_registry((ProjectConfig(slug="widget", roots=("/r/widget",)),)), encoding="utf-8")
              v0 = registry.read_bytes()
              backup = tmp_path / "project-hippo.yaml.bak-117-20260101T000000Z"

              first = record_discoveries([ProjectConfig(slug="widget", roots=("/r/widget",), remotes=("github.com/acme/widget",))],
                                         registry_path=registry, backup_path=backup)
              v1 = registry.read_bytes()
              second = record_discoveries([ProjectConfig(slug="gadget", roots=("/r/gadget",), remotes=("github.com/acme/gadget",))],
                                          registry_path=registry, backup_path=backup)

              assert first.status == second.status == "written"
              assert first.backup != second.backup
              assert first.backup.read_bytes() == v0
              assert second.backup.read_bytes() == v1
      - id: e3
        kind: test_output
        content: |
          $ python -m pytest -q tests/test_registry_backfill.py -k same_second
          .                                                                    [100%]
          1 passed, 41 deselected in 0.31s

