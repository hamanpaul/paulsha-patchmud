  - id: eng-config-port-range
    gold: not_satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/repair-config-rollback partial.patch"}
    rationale: 改動只碰 _bool；_port 仍直接 int(value)。reload 是唯一安裝設定的路徑，parse 後直接 active.update，_derive 只檢查 region，因此 PORT=70000 會寫入 active 設定。
    criterion: >-
      Setting the PORT environment variable to an out-of-range value such as
      70000 is rejected before the active configuration changes.
    evidence:
      - id: e1
        kind: diff
        content: |
          --- a/src/config.py
          +++ b/src/config.py
          @@ -5,7 +5,7 @@ DEFAULTS = {"enabled": True, "port": 8080, "region": "us-east"}
           def _bool(value: str | None, default: bool) -> bool:
               # The bug: an explicit false is treated as if the variable were absent.
          -    if not value:
          +    if value is None:
                   return default
      - id: e2
        kind: source
        content: |
          # src/config.py after the change (remaining functions are unchanged)
          def _port(value: str | None, default: int) -> int:
              if value is None:
                  return default
              return int(value)


          def parse(file_values: dict[str, object], env: dict[str, str]) -> dict[str, object]:
              result = dict(DEFAULTS)
              result.update(file_values)
              result["enabled"] = _bool(env.get("ENABLED"), bool(result["enabled"]))
              result["port"] = _port(env.get("PORT"), int(result["port"]))
              return result
      - id: e3
        kind: source
        content: |
          # src/reloader.py (unchanged) — the only code that installs a configuration
          class ConfigStore:
              """Keep the last known-good configuration and its derived cache."""

              def __init__(self, file_values, env):
                  self.file_values = dict(file_values)
                  self.active = parse(self.file_values, env)
                  self.cache = self._derive(self.active)

              @staticmethod
              def _derive(config):
                  if not isinstance(config["region"], str) or not config["region"]:
                      raise ValueError("region must be non-empty")
                  return {"endpoint": f"{config['region']}:{config['port']}"}

              def reload(self, file_values, env):
                  candidate = parse(file_values, env)
                  self.file_values = dict(file_values)
                  self.active.update(candidate)
                  self.cache = self._derive(self.active)

