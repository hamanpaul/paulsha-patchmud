          # src/testpilot/core/testbed_bootstrap.py（每次 plugin 指令啟動時呼叫）
          def stage_plugin_testbed(plugin_dir: Path, plugin_name: str, configs_dir: Path) -> Path:
              template = plugin_dir / PLUGIN_TESTBED_TEMPLATE
              configs_dir.mkdir(parents=True, exist_ok=True)
              destination = configs_dir / EFFECTIVE_TESTBED
              marker = staged_marker(plugin_name)
              template_text = template.read_text(encoding="utf-8")

              if destination.is_file():
                  current = destination.read_text(encoding="utf-8")
                  if current.startswith(marker):
                      if current != marker + template_text:
                          log.info("configs/testbed.yaml keeps operator edits for plugin '%s'", plugin_name)
                      return destination

              destination.write_text(marker + template_text, encoding="utf-8")
              return destination
