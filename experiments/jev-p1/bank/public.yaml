  - id: eng-cache-304-bodyless
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/repair-cache-api partial.patch"}
    rationale: 改動後 ETag 相符時回傳 (304, etag, None)，不相符時回傳 (200, etag, row)，兩個分支都直接可見。
    criterion: >-
      ProfileAPI.read returns status 304 with no body when the caller's
      if_none_match equals the current ETag, and status 200 with the profile
      representation otherwise.
    evidence:
      - id: e1
        kind: diff
        content: |
          --- a/src/api.py
          +++ b/src/api.py
          @@ -11,7 +11,7 @@ class ProfileAPI:
                   row = self.cache.get(profile_id, self.store.get)
                   etag = f"v{row['version']}"
                   if if_none_match == etag:
          -            return 304, etag, row  # Bug: a 304 response must not carry a body.
          +            return 304, etag, None
                   return 200, etag, row
      - id: e2
        kind: source
        content: |
          # src/api.py after the change
          class ProfileAPI:
              def __init__(self):
                  self.store = ProfileStore()
                  self.cache = ProfileCache()

              def read(self, profile_id, if_none_match=None):
                  row = self.cache.get(profile_id, self.store.get)
                  etag = f"v{row['version']}"
                  if if_none_match == etag:
                      return 304, etag, None
                  return 200, etag, row

  - id: eng-cache-invalidate-updated-key
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/repair-cache-api reference.patch"}
    rationale: invalidate 只刪除該 profile_id 的項目，update 在 store.update 成功後才呼叫 invalidate(profile_id)。
    criterion: >-
      After a successful profile update, only the updated profile's cache entry
      is invalidated; cached entries for other profiles are kept.
    evidence:
      - id: e1
        kind: diff
        content: |
          --- a/src/cache.py
          +++ b/src/cache.py
          @@ class ProfileCache:
               def invalidate(self, profile_id):
                   # Bug: every update flushes every profile and callers can retain stale data.
          -        self.items.clear()
          +        if profile_id in self.items:
          +            del self.items[profile_id]
      - id: e2
        kind: source
        content: |
          # src/cache.py after the change
          class ProfileCache:
              def __init__(self):
                  self.items = {}

              def get(self, profile_id, loader):
                  if profile_id not in self.items:
                      self.items[profile_id] = loader(profile_id)
                  return dict(self.items[profile_id])

              def invalidate(self, profile_id):
                  if profile_id in self.items:
                      del self.items[profile_id]

          # src/api.py (unchanged)
              def update(self, profile_id, name):
                  row = self.store.update(profile_id, name)
                  self.cache.invalidate(profile_id)
                  return row

  - id: eng-ratelimit-retry-after-bounded
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/scope-rate-limit reference.patch"}
    rationale: float 解析成功時夾在 [0, 60]，解析失敗改用 1.0 秒，且都經 clock.sleep；三個條件都由程式直接成立。
    criterion: >-
      For an HTTP 429 response, the client sleeps through the injected clock for
      the Retry-After delay (capped at 60 seconds), never sleeps for a negative
      duration, and falls back to a bounded delay when the header is malformed.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/client.py after the change
          from .errors import AuthenticationFailed, RateLimitExceeded


          def request(send, clock, *, max_attempts=3):
              attempts = 0
              while True:
                  attempts += 1
                  response = send()
                  if response.status == 200:
                      return response
                  if response.status == 401:
                      raise AuthenticationFailed()
                  if response.status != 429:
                      return response
                  try:
                      delay = max(0.0, min(float(response.headers.get("Retry-After", "0")), 60.0))
                  except (TypeError, ValueError):
                      delay = 1.0
                  clock.sleep(delay)
                  if attempts >= max_attempts:
                      raise RateLimitExceeded()

  - id: eng-migration-dry-run-no-mutation
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/repair-migration-state reference.patch"}
    rationale: dry_run 分支在任何 write_v2 與 journal.checkpoint 之前就 return，且回傳的 cursor 不前進。
    criterion: >-
      Calling run(..., dry_run=True) reports the planned batch without writing
      any records and without advancing the journal checkpoint.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/migrate.py after the change
          def run(store: RecordStore, journal: Journal, batch_size=2, *, dry_run=False, fail_after_write=False):
              cursor = journal.cursor
              batch = store.rows[cursor:cursor + batch_size]
              if not batch:
                  return {"cursor": cursor, "planned": 0}
              if dry_run:
                  return {"cursor": cursor, "planned": len(batch)}
              for row in batch:
                  store.write_v2(_v2(row))
              if fail_after_write:
                  raise RuntimeError("worker restarted after write")
              journal.checkpoint(cursor + len(batch))
              return {"cursor": cursor + len(batch), "planned": len(batch)}

  - id: eng-fakeclock-success-no-sleep
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/testing-retry-fakeclock partial.patch"}
    rationale: 移除成功分支的 sleep 後，result == "ok" 時在任何 clock.sleep 之前 return。
    criterion: >-
      When send() returns "ok", dispatch() returns immediately without calling
      clock.sleep.
    evidence:
      - id: e1
        kind: diff
        content: |
          --- a/src/dispatcher.py
          +++ b/src/dispatcher.py
          @@ -7,7 +7,6 @@ def dispatch(send, clock, cancellation, request_id, *, max_attempts=3, log=None)
                   result = send(request_id)
                   log.append({"request_id": request_id, "attempt": attempt, "status": result})
                   if result == "ok":
          -            clock.sleep(delay(attempt))  # Bug: success schedules a needless delay.
                       return result
                   if result == "permanent":
                       return result
      - id: e2
        kind: source
        content: |
          # src/dispatcher.py after the change
          def dispatch(send, clock, cancellation, request_id, *, max_attempts=3, log=None):
              log = [] if log is None else log
              for attempt in range(1, max_attempts + 1):
                  result = send(request_id)
                  log.append({"request_id": request_id, "attempt": attempt, "status": result})
                  if result == "ok":
                      return result
                  if result == "permanent":
                      return result
                  clock.sleep(delay(attempt))
                  if cancellation.cancelled:
                      return "cancelled"
              return "exhausted"

  - id: eng-parser-duplicate-header
    gold: satisfied
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/testing-parser-matrix reference.patch"}
    rationale: 重複 header 時 raise ValueError("header duplicate")，與 "row width" 訊息不同；新增測試分別斷言兩種訊息且通過。
    criterion: >-
      parse() raises ValueError when the header row contains the same column name
      twice, and that error is distinguishable from the row-width error.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/parser.py after the change
          import csv
          from io import StringIO


          def parse(text):
              reader = csv.reader(StringIO(text))
              headers = next(reader)
              if len(headers) != len(set(headers)):
                  raise ValueError("header duplicate")
              rows = []
              for values in reader:
                  if not values:
                      continue
                  if len(values) != len(headers):
                      raise ValueError("row width")
                  rows.append(dict(zip(headers, values)))
              return rows
      - id: e2
        kind: test
        content: |
          # tests/agent/test_parser_regression.py (new)
