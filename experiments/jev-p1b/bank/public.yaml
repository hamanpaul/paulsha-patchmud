  source:
    kind: public-fixture
    ref: 'paulsha-patchmud PR #40 engineering-v1/diagnosis-retry-budget repo 證據（沿用 P1 題庫 b1a6f5e6，P1 split：public）'
  rationale: r17、r18 各有一次 timeout 重試，但各自只有一個 delivery id 且 delivered=1；summary 顯示 duplicate_delivery_ids=0。事故單的「重複投遞」是把 attempt 當成 delivery；受信端 ledger 也只有每個 request 一筆。（凍結前 Codex 審查建議補受信端紀錄。）
  criterion: Requests r17 and r18 were each delivered twice (a duplicate delivery) after the version 2.4 timeout change.
  evidence:
  - id: e1
    kind: ticket
    content: |
      INC-311: Since 2.4 went out we are seeing duplicate deliveries. r17 and r18
      were both sent twice. Please confirm the timeout change caused duplicates.
  - id: e2
    kind: log
    content: |
      2026-09-21T09:01:02Z version=2.4 request=r17 attempt=1 status=timeout
      2026-09-21T09:01:04Z version=2.4 request=r17 attempt=2 status=202 delivery=d91
      2026-09-21T09:01:04Z version=2.4 request=r17 delivered=1
      2026-09-21T09:03:11Z version=2.4 request=r18 attempt=1 status=timeout
      2026-09-21T09:03:13Z version=2.4 request=r18 attempt=2 status=202 delivery=d92
      2026-09-21T09:03:13Z version=2.4 request=r18 delivered=1
      2026-09-21T09:11:08Z version=2.5 request=r19 attempt=1 status=202 delivery=d93
      2026-09-21T09:11:08Z version=2.5 request=r19 delivered=1
      2026-09-21T09:12:00Z summary attempts=8 deliveries=3 duplicate_delivery_ids=0
  - id: e3
    kind: source
    content: |
      # src/retry.py
      def delivery_confirmed(response):
          return response.status == 202 and response.headers.get("X-Delivery-Id") is not None

      # src/worker.py
      def deliver(client, message, log):
          attempts = 0
          while True:
              attempts += 1
              response = client.send(message)
              log.append({"attempt": attempts, "status": response.status, "id": response.headers.get("X-Delivery-Id")})
              if delivery_confirmed(response):
                  return attempts
              if not should_retry(attempts, response.error):
                  raise RuntimeError("delivery failed")
  - id: e4
    kind: record
    content: |
      # Recipient-side delivery ledger exported by the receiving service for 09:00–09:15Z
      # (one row per message the recipient accepted; a timed-out attempt that reached the
      # recipient would appear here as its own row).
      delivery_id=d91 request=r17 accepted_at=2026-09-21T09:01:04Z
      delivery_id=d92 request=r18 accepted_at=2026-09-21T09:03:13Z
      delivery_id=d93 request=r19 accepted_at=2026-09-21T09:11:08Z
  ac_type: non_code
  route_label: JEV_ELIGIBLE
  clauses:
  - Request r17 was delivered more than once.
  - Request r18 was delivered more than once.
