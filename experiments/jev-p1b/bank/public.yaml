- id: eng-cache-invalidate-updated-key
  gold: satisfied
  traps: []
  source:
    kind: public-fixture
    ref: 'paulsha-patchmud PR #40 engineering-v1/repair-cache-api reference.patch（沿用 P1 題庫 b1a6f5e6，P1 split：public）'
  rationale: invalidate 只刪除該 profile_id 的項目，update 在 store.update 成功後才呼叫 invalidate(profile_id)。
  criterion: After a successful profile update, only the updated profile's cache entry is invalidated; cached entries for other profiles are kept.
  evidence:
  - id: e1
    kind: diff
    content: |
      --- a/src/cache.py
      +++ b/src/cache.py
      @@ class ProfileCache:
           def invalidate(self, profile_id):
               # Bug: every update flushes every profile and callers can retain stale data.
      -        self.items.clear()
      +        if profile_id in self.items:
      +            del self.items[profile_id]
  - id: e2
    kind: source
    content: |
      # src/cache.py after the change
      class ProfileCache:
          def __init__(self):
              self.items = {}

          def get(self, profile_id, loader):
              if profile_id not in self.items:
                  self.items[profile_id] = loader(profile_id)
              return dict(self.items[profile_id])

          def invalidate(self, profile_id):
              if profile_id in self.items:
                  del self.items[profile_id]

      # src/api.py (unchanged)
          def update(self, profile_id, name):
              row = self.store.update(profile_id, name)
              self.cache.invalidate(profile_id)
              return row
  ac_type: code_behavior
  route_label: LLM_REQUIRED
  clauses:
  - After a successful profile update, the updated profile's cache entry is invalidated.
  - After a successful profile update, cached entries for other profiles are kept.
