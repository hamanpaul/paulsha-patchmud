  rationale: 就緒探測只要求 console 回顯 echo 的 sentinel；裝置文件載明 bootloader shell 也支援 echo，因此停在 bootloader 時同樣會被判定就緒。
  criterion: 裝置重開機後，harness 要確認 console 已回到作業系統才繼續後續案例；bootloader 的命令列不能被當成已就緒。
  evidence:
  - id: e1
    kind: source
    content: |
      def _wait_device_boot_ready(self, device, *, timeout: float = 180.0, poll_interval: float = 10.0) -> bool:
          """reboot 後輪詢便宜探測，直到 console 回顯 sentinel 或逾時。"""
          deadline = time.monotonic() + max(float(timeout), poll_interval)
          probe = "echo __BOOT_OK__"
          while True:
              try:
                  out = self._output_text(self._execute_command(device, probe, timeout=15.0))
              except Exception:
                  out = ""
              if "__BOOT_OK__" in out:
                  return True
              if time.monotonic() >= deadline:
                  return False
              time.sleep(poll_interval)
  - id: e2
    kind: documentation
    content: |
      Device console reference, section 2.1 (bootloader shell):
      Before the operating system starts, the console presents the bootloader
      prompt. Available commands: help, echo, printenv, setenv, tftpboot, bootm, reset.
  - id: e3
    kind: review_comment
    content: |
      LGTM. Boot-ready gate added: reopen is retried and the console must answer
      the probe before the next case runs.
  - id: e4
    kind: test_output
    content: |
      tests/test_remediation.py::test_reboot_waits_for_console_ready PASSED
      1 passed in 0.04s
  ac_type: code_behavior
  route_label: LLM_REQUIRED
  clauses:
  - 裝置重開機後，harness 確認 console 已回到作業系統才繼續後續案例。
  - bootloader 的命令列不會被當成已就緒。
