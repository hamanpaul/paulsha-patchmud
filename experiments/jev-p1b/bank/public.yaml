- id: eng-cache-304-bodyless
  gold: satisfied
  traps: []
  source:
    kind: public-fixture
    ref: 'paulsha-patchmud PR #40 engineering-v1/repair-cache-api partial.patch（沿用 P1 題庫 b1a6f5e6，P1 split：public）'
  rationale: 改動後 ETag 相符時回傳 (304, etag, None)，不相符時回傳 (200, etag, row)，兩個分支都直接可見。
  criterion: ProfileAPI.read returns status 304 with no body when the caller's if_none_match equals the current ETag, and status 200 with the profile representation otherwise.
  evidence:
  - id: e1
    kind: diff
    content: |
      --- a/src/api.py
      +++ b/src/api.py
      @@ -11,7 +11,7 @@ class ProfileAPI:
               row = self.cache.get(profile_id, self.store.get)
               etag = f"v{row['version']}"
               if if_none_match == etag:
      -            return 304, etag, row  # Bug: a 304 response must not carry a body.
      +            return 304, etag, None
               return 200, etag, row
  - id: e2
    kind: source
    content: |
      # src/api.py after the change
      class ProfileAPI:
          def __init__(self):
              self.store = ProfileStore()
              self.cache = ProfileCache()

          def read(self, profile_id, if_none_match=None):
              row = self.cache.get(profile_id, self.store.get)
              etag = f"v{row['version']}"
              if if_none_match == etag:
                  return 304, etag, None
              return 200, etag, row
  ac_type: code_behavior
  route_label: LLM_REQUIRED
  clauses:
  - When if_none_match equals the current ETag, read() returns status 304.
  - When if_none_match equals the current ETag, read() returns no body.
  - When if_none_match does not equal the current ETag, read() returns status 200 with the profile representation.
