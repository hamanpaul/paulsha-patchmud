  # ===================================================== code_behavior / satisfied
  - id: h-code-checkpoint-after-write
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["recover() appends the checkpoint to the journal only after every record in the batch has been written."]
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v1/recovery-checkpoint reference.patch"}
    rationale: journal.append 移到所有 store.write 之後；fail_before_write／fail_after_write 都在 append 之前 raise，因此 checkpoint 只會在整批寫完後記錄。
    criterion: recover() appends the checkpoint to the journal only after every record in the batch has been written.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/recover.py after the change
          def recover(store, journal, rows, batch_size=2, *, fail_before_write=False, fail_after_write=False):
              cursor = journal.cursor
              batch = list(rows[cursor:cursor + batch_size])
              if not batch:
                  return {"cursor": cursor, "processed": 0}

              if fail_before_write:
                  raise RuntimeError("worker stopped before batch write")
              for row in batch:
                  store.write(row)
              if fail_after_write:
                  raise RuntimeError("worker stopped after batch write")
              journal.append(cursor + len(batch))
              return {"cursor": cursor + len(batch), "processed": len(batch)}

