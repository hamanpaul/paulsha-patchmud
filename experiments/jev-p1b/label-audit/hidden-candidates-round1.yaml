          # src/migrate.py after the change
          def run(store, journal, batch_size=2, *, dry_run=False, fail_after_write=False):
              cursor = journal.cursor
              batch = store.rows[cursor:cursor + batch_size]
              if not batch:
                  return {"cursor": cursor, "planned": len(batch)}
              if dry_run:
                  for row in batch:
                      store.write_v2(_v2(row))
                  return {"cursor": cursor + len(batch), "planned": len(batch)}
              journal.checkpoint(cursor + len(batch))
              for row in batch:
                  store.write_v2(_v2(row))
              return {"cursor": cursor + len(batch), "planned": len(batch)}
      - id: e3
        kind: review_comment
        content: LGTM, dry-run is clean now.

  - id: hv-code-checkpoint-stale-comment
    variant_of: h-code-checkpoint-after-write
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["recover() appends the checkpoint to the journal only after every record in the batch has been written."]
    traps: [persuasive_text]
    source: {kind: public-fixture, ref: "h-code-checkpoint-after-write 的誤導變體"}
    rationale: 同基礎題；程式已把 append 移到寫入之後，但留下過時的「# Bug」註解。
    criterion: recover() appends the checkpoint to the journal only after every record in the batch has been written.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/recover.py after the change
          def recover(store, journal, rows, batch_size=2, *, fail_before_write=False, fail_after_write=False):
              cursor = journal.cursor
              batch = list(rows[cursor:cursor + batch_size])
              if not batch:
                  return {"cursor": cursor, "processed": 0}

              # Bug: the cursor is advanced before the batch is durable.
              if fail_before_write:
                  raise RuntimeError("worker stopped before batch write")
              for row in batch:
                  store.write(row)
              if fail_after_write:
                  raise RuntimeError("worker stopped after batch write")
              journal.append(cursor + len(batch))
              return {"cursor": cursor + len(batch), "processed": len(batch)}

