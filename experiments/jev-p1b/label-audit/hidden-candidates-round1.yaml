  - id: h-code-outbox-tenant-identity
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["Jobs with the same id in different tenants are tracked under different keys in the queue state."]
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v2/repair-outbox-restart partial.patch（identity 部分）"}
    rationale: identity 改為 json.dumps([tenant, id])，process 的所有 outbox／acked 操作都用這個 key，不同 tenant 的同 id 不會相撞。
    criterion: Jobs with the same id in different tenants are tracked under different keys in the queue state.
    evidence:
      - id: e1
        kind: diff
        content: |
          --- a/src/worker.py
          +++ b/src/worker.py
          @@ -3,7 +3,7 @@
           from .sink import Sink

           def identity(job):
          -    return str(job['id'])
          +    return json.dumps([job['tenant'], str(job['id'])], separators=(',', ':'))
      - id: e2
        kind: source
        content: |
          # src/worker.py after the change (process)
          def process(self, job, interrupt=None, **options):
              state = self.store.read('queue', {'outbox': {}, 'acked': []})
              key = identity(job)
              if key in state['acked']:
                  if self.sink.effects().get(key) != job['payload']:
                      raise ValueError('conflicting delivery')
                  return
              if key in state['outbox'] and state['outbox'][key] != job['payload']:
                  raise ValueError('conflicting delivery')
              state['outbox'][key] = job['payload']
              self.store.commit('queue', state)
              self.sink.deliver(key, state['outbox'][key])
              state['outbox'].pop(key)
              state['acked'].append(key)
              self.store.commit('queue', state)

