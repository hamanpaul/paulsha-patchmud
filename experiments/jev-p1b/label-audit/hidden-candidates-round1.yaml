  - id: h-code-rollout-duplicate-operation
    gold: satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses:
      - "apply() with an operation id that already exists raises an error."
      - "apply() with an existing operation id leaves that operation's journal entries unchanged."
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v2/recovery-rollout-cas reference.patch"}
    rationale: apply 一開頭就檢查 operation 是否已在 journal，存在即 raise，在任何寫入 journal 之前。
    criterion: >-
      Calling apply() with an operation id that already exists raises an error and
      leaves that operation's journal entries unchanged.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/rollout.py after the change (apply)
          def apply(self, operation, changes, fail_after=None):
              if operation in self.journal:
                  raise ValueError('operation already exists')
              entries = []
              self.journal[operation] = entries
              for name, value in changes.items():
                  before = self.config.read(name)
                  intent = {'name': name, 'before': before, 'after': {'revision': before['revision'] + 1, 'value': deepcopy(value)}, 'done': False, 'conflict': False}
                  entries.append(intent)
                  if not self.config.cas(name, before['revision'], value, owner=operation + ':apply'):
                      intent['conflict'] = True
                  if fail_after == name:
                      raise RuntimeError('interrupted apply')

