          # src/migrate.py after the change
          def run(store, journal, batch_size=2, *, dry_run=False, fail_after_write=False):
              cursor = journal.cursor
              batch = store.rows[cursor:cursor + batch_size]
              if not batch:
                  return {"cursor": cursor, "planned": len(batch)}
              if dry_run:
                  for row in batch:
                      store.write_v2(_v2(row))
                  return {"cursor": cursor + len(batch), "planned": len(batch)}
              journal.checkpoint(cursor + len(batch))
              for row in batch:
                  store.write_v2(_v2(row))
              return {"cursor": cursor + len(batch), "planned": len(batch)}

  - id: h-code-rollout-overwrites-operator
    gold: not_satisfied
    ac_type: code_behavior
    route_label: LLM_REQUIRED
    clauses: ["recover() does not overwrite a key that another operator wrote after the rollout, even when the operator wrote the same value."]
    traps: []
    source: {kind: public-fixture, ref: "paulsha-patchmud PR #40 engineering-v2/recovery-rollout-cas partial.patch"}
    rationale: partial 只比對 value；operator 寫入相同值時 revision 已變、owner 為 None，但條件仍成立，recover 會以 CAS 覆寫 operator 的寫入。
    criterion: >-
      recover() does not overwrite a key that another operator wrote after the
      rollout, even when the operator wrote the same value the rollout had written.
    evidence:
      - id: e1
        kind: source
        content: |
          # src/config.py (unchanged)
          class Config:
              def read(self, name):
                  return deepcopy(self.values[name])

              def cas(self, name, revision, value, owner=None):
                  current = self.values[name]
                  if current['revision'] != revision:
                      return False
                  self.values[name] = {'revision': revision + 1, 'value': deepcopy(value)}
                  self.owners[name] = owner
                  return True

              def operator(self, name, value):
                  old = self.values[name]
                  self.cas(name, old['revision'], value)
      - id: e2
        kind: source
        content: |
          # src/rollout.py after the change (recover)
          def recover(self, operation, fail_after=None):
              if operation not in self.journal:
                  return []
              conflicts = []
              for entry in reversed(self.journal[operation]):
                  if entry['done']:
                      if entry['conflict']: conflicts.append(entry['name'])
                      continue
                  current = self.config.read(entry['name'])
                  if current['value'] == entry['after']['value']:
                      self.config.cas(entry['name'], current['revision'], entry['before']['value'], owner=operation + ':recover')
                  elif current == {'revision': entry['after']['revision'] + 1, 'value': entry['before']['value']} and self.config.owners[entry['name']] == operation + ':recover':
                      pass
                  else:
                      entry['conflict'] = True
                      conflicts.append(entry['name'])
                  entry['done'] = True
              return sorted(set(conflicts))

