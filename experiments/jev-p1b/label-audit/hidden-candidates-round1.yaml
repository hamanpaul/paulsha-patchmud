          def request(send, clock, *, max_attempts=3):
              attempts = 0
              while True:
                  attempts += 1
                  response = send()
                  if response.status == 200:
                      return response
                  if response.status == 401:
                      raise AuthenticationFailed()
                  delay = float(response.headers.get("Retry-After", "0"))
