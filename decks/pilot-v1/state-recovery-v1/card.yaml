schema_version: 1
issue_id: state-recovery-v1
archetype: state-recovery
difficulty: medium
difficulty_scale: 1.0
expected_patch_loc: [2, 20]
wall_clock_seconds: 600
max_turns: 8
allowed_paths:
  - "src/**"
  - "tests/agent/**"
expected_paths:
  - "src/snapshot.py"
public_requirements:
  - id: MAIN-1
    text: transient scan failure must not emit removal（暫時性掃描失敗不得誤判為刪除）
    probe: tests/public/test_transient_scan_failure.py
critical_requirements:
  - id: CR-1
    hidden_probe: hidden/test_cr1_transient_no_removal.py
  - id: CR-2
    hidden_probe: hidden/test_cr2_real_deletion.py
regression_probes:
  - tests/starter/
  - smoke: ["python3", "-B", "-c", "import sys; sys.path.insert(0, 'src'); import snapshot"]
compat_probes:
  - probe: tests/starter/test_snapshot_basics.py
power_rubric:
  functional:
    points: 60
    groups:
      - {id: CR-1, points: 40, probe: hidden/test_cr1_transient_no_removal.py}
      - {id: CR-2, points: 20, probe: hidden/test_cr2_real_deletion.py}
  robustness:
    points: 15
    probes: [hidden/test_cr1_transient_no_removal.py, hidden/test_cr2_real_deletion.py]
  compatibility:
    points: 10
    probes: [tests/starter/test_snapshot_basics.py]
  maintainability:
    points: 10
  runtime_efficiency:
    points: 5
    probes: [hidden/test_cr1_transient_no_removal.py]
    timeout_factor: 3.0
reference_cost: null
