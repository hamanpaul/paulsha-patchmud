schema_version: 1
issue_id: parser-edge-v1
briefing: 'key=value 解析把值裡的 = 一起切掉，含網址（?a=1）的值會損毀'
archetype: parser-edge
difficulty: easy
difficulty_scale: 1.0
expected_patch_loc: [1, 15]
wall_clock_seconds: 300
max_turns: 6
allowed_paths:
  - "src/**"
  - "tests/agent/**"
expected_paths:
  - "src/kvconfig.py"
public_requirements:
  - id: MAIN-1
    text: 當 value 本身含有 '=' 字元時，必須保留完整 value（只在第一個 '=' 分割）
    probe: tests/public/test_value_with_equals.py
critical_requirements:
  - id: CR-1
    hidden_probe: hidden/test_cr1_kv_parsing.py
regression_probes:
  - tests/starter/
  - smoke: ["python3", "-B", "-c", "import sys; sys.path.insert(0, 'src'); import kvconfig"]
compat_probes:
  - probe: tests/starter/test_kvconfig_basics.py
power_rubric:
  functional:
    points: 60
    groups:
      - {id: CR-1, points: 60, probe: hidden/test_cr1_kv_parsing.py}
  robustness:
    points: 15
    probes: [hidden/test_cr1_kv_parsing.py]
  compatibility:
    points: 10
    probes: [tests/starter/test_kvconfig_basics.py]
  maintainability:
    points: 10
  runtime_efficiency:
    points: 5
    probes: [hidden/test_cr1_kv_parsing.py]
    timeout_factor: 3.0
reference_cost: null
