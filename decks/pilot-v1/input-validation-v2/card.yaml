schema_version: 1
issue_id: input-validation-v2
archetype: input-validation
difficulty: easy
difficulty_scale: 1.0
expected_patch_loc: [2, 20]
wall_clock_seconds: 300
max_turns: 6
allowed_paths:
  - "src/**"
  - "tests/agent/**"
expected_paths:
  - "src/bincode.py"
public_requirements:
  - id: MAIN-1
    text: 儲位代碼必須以數字結尾（檢查碼），結尾非數字必須判定為無效
    probe: tests/public/test_end_digit.py
critical_requirements:
  - id: CR-1
    hidden_probe: hidden/test_cr1_end_digit.py
regression_probes:
  - tests/starter/
  - smoke: ["python3", "-B", "-c", "import sys; sys.path.insert(0, 'src'); import bincode"]
compat_probes:
  - probe: tests/starter/test_bincode_basics.py
power_rubric:
  functional:
    points: 60
    groups:
      - {id: CR-1, points: 60, probe: hidden/test_cr1_end_digit.py}
  robustness:
    points: 15
    probes: [hidden/test_cr1_end_digit.py]
  compatibility:
    points: 10
    probes: [tests/starter/test_bincode_basics.py]
  maintainability:
    points: 10
  runtime_efficiency:
    points: 5
    probes: [hidden/test_cr1_end_digit.py]
    timeout_factor: 3.0
reference_cost: null
