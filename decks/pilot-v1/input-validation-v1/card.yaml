schema_version: 1
issue_id: input-validation-v1
briefing: '折扣碼驗證漏了長度檢查，10 個字以上的爛碼也會被當成有效'
archetype: input-validation
difficulty: easy
difficulty_scale: 1.0
expected_patch_loc: [2, 20]
wall_clock_seconds: 300
max_turns: 6
allowed_paths:
  - "src/**"
  - "tests/agent/**"
expected_paths:
  - "src/discount.py"
public_requirements:
  - id: MAIN-1
    text: 折扣碼長度必須在 6-10 個字元之間，超出範圍必須判定為無效
    probe: tests/public/test_length_bounds.py
critical_requirements:
  - id: CR-1
    hidden_probe: hidden/test_cr1_length_bounds.py
regression_probes:
  - tests/starter/
  - smoke: ["python3", "-B", "-c", "import sys; sys.path.insert(0, 'src'); import discount"]
compat_probes:
  - probe: tests/starter/test_discount_basics.py
power_rubric:
  functional:
    points: 60
    groups:
      - {id: CR-1, points: 60, probe: hidden/test_cr1_length_bounds.py}
  robustness:
    points: 15
    probes: [hidden/test_cr1_length_bounds.py]
  compatibility:
    points: 10
    probes: [tests/starter/test_discount_basics.py]
  maintainability:
    points: 10
  runtime_efficiency:
    points: 5
    probes: [hidden/test_cr1_length_bounds.py]
    timeout_factor: 3.0
reference_cost: null
